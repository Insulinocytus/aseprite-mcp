name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches plugin version
        run: |
          $version = (Get-Content plugin/package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag $env:GITHUB_REF_NAME does not match plugin/package.json version $version" }

      - name: Server seam tests
        run: cargo test --manifest-path server/Cargo.toml

      # Builds the release Server and writes dist/aseprite-mcp-<version>.aseprite-extension.
      - name: Package extension
        run: pwsh scripts/package.ps1

      - name: Zip Skill
        run: Compress-Archive -Path skills/aseprite-lua -DestinationPath dist/aseprite-lua-skill.zip

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ext = (Get-ChildItem dist/*.aseprite-extension).FullName
          gh release create $env:GITHUB_REF_NAME $ext dist/aseprite-lua-skill.zip --title $env:GITHUB_REF_NAME --generate-notes
