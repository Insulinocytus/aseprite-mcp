[package]
name = "aseprite-mcp-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
parking_lot = "0.12.5"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-streamable-http-server"] }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = "0.7.20"

[dev-dependencies]
futures-util = "0.3.34"
rmcp = { version = "3.5.1", features = ["client", "transport-streamable-http-client-reqwest"] }
tokio-tungstenite = "0.30.0"
